name: Docker Image CI Alpine Old

on: workflow_dispatch

# 同一 ref 上的运行互斥，push 触发时取消上一次仍在执行的计划任务，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# 最小权限原则：仅读取仓库内容
permissions:
  contents: read

jobs:
  # 每个 PHP 版本 × 架构一条腿。arm64 用 GitHub 原生 ARM runner（公共仓库免费），
  # 避免 QEMU 模拟编译 intl/gd/imagick 等扩展（模拟比原生慢 10 倍以上）。
  # 单架构镜像先推 {tag}-amd64 / {tag}-arm64 中间 tag，merge job 再合成多架构 manifest。
  build:
    strategy:
      fail-fast: false
      matrix:
        # 版本表只在此处定义，merge job 用 YAML alias 引用（Actions 自 2025-08 支持 anchor/alias）
        array: &versions
          [
            {
              php_version: "7.4",
              upstream_version: "7.4-fpm-nginx-alpine",
              tag: "7.4-alpine"
            },
          ]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to ALIYUN CR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNCR_USERNAME }}
          password: ${{ secrets.ALIYUNCR_PASSWORD }}
      - name: Build and push (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          platforms: linux/${{ matrix.arch }}
          file: "Dockerfile.alpine-old.template"
          tags: |
            davyinsa/docker-nginx-php:${{ matrix.array.tag }}-${{ matrix.arch }}
            registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${{ matrix.array.tag }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.array.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.array.tag }}-${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.array.php_version }}
            UPSTREAM_VERSION=${{ matrix.array.upstream_version }}

  # 两个架构的镜像都推完后，合成多架构 manifest 并打上正式 tag。
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 直接复用 build 的版本表，避免加 PHP 版本时两处不同步（漏改会静默不合成正式 tag）
        array: *versions

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to ALIYUN CR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNCR_USERNAME }}
          password: ${{ secrets.ALIYUNCR_PASSWORD }}
      - name: Merge multi-arch manifest for ${{ matrix.array.tag }}
        run: |
          set -euo pipefail
          TAG="${{ matrix.array.tag }}"
          docker buildx imagetools create \
            -t "davyinsa/docker-nginx-php:${TAG}" \
            "davyinsa/docker-nginx-php:${TAG}-amd64" \
            "davyinsa/docker-nginx-php:${TAG}-arm64"
          docker buildx imagetools create \
            -t "registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${TAG}" \
            "registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${TAG}-amd64" \
            "registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${TAG}-arm64"
